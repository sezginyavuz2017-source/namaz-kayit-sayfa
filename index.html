<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namaz Kule Kayıt</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#111;color:#eee}
  button{font-size:18px;padding:14px 18px;margin:6px 4px;border:0;border-radius:10px;background:#2a6;color:#fff}
  button.red{background:#c33} button.gray{background:#444} button:disabled{opacity:.4}
  .box{background:#1c1c1c;border-radius:10px;padding:12px;margin:10px 0}
  .row{display:flex;justify-content:space-between;padding:4px 0}
  #log{font-size:12px;color:#999;white-space:pre-wrap;max-height:140px;overflow:auto}
  textarea{width:100%;box-sizing:border-box;font-size:15px;padding:8px;background:#333;color:#eee;border:0;border-radius:6px;margin-top:6px}
  select{font-size:16px;padding:6px;background:#333;color:#eee;border:0;border-radius:6px}
  .file{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #333}
  .file>span{width:100%}
  .file select{flex:1 1 40%;min-width:0}
  .file button{flex:1 1 40%;margin:0}
</style>
</head>
<body>
<h2>Namaz Kule Kayıt</h2>
<div class="box">
  <button id="bConn">Kule'ye bağlan</button>
  <div class="row"><span>Bağlantı</span><b id="sConn">yok</b></div>
  <div class="row"><span>Yaka</span><b id="sYaka">-</b></div>
  <div class="row"><span>Kayıt</span><b id="sRec">-</b></div>
  <div class="row"><span>Konum</span><b id="sKonum">-</b></div>
</div>
<div class="box">
  <div class="row"><span>Kategori</span>
    <select id="selKat"><option value="standart">Standart</option><option value="bayan">Bayan</option><option value="engelli">Engelli</option><option value="oturarak">Oturarak namaz</option><option value="aci_zorlanan">Açılarda zorlanan</option></select></div>
  <div class="row"><span>Rekat</span>
    <select id="selRek"><option value="">seç…</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="0">belirsiz</option></select></div>
  <textarea id="txtNot" rows="3" placeholder="Not: özel durumlar, önemli hareketler (kayıt sırasında ya da sonrasında yazabilirsin)"></textarea>
  <button id="bStart" class="" disabled>Kaydı başlat</button>
  <button id="bStop" class="red" disabled>Kaydı bitir</button>
</div>
<div class="box">
  <button id="bList" class="gray" disabled>Kayıtları listele</button>
  <button id="bDelAll" class="gray" disabled>Tümünü sil</button>
  <div id="files"></div>
</div>
<div id="log"></div>
<script>
const SVC='4fa10001-e3a3-4101-b423-d62b3b4b9141';
const C_STATUS='4fa10002-e3a3-4101-b423-d62b3b4b9141';
const C_SET='4fa10004-e3a3-4101-b423-d62b3b4b9141';
const C_REC='4fa10006-e3a3-4101-b423-d62b3b4b9141';
let dev,cs,cset,crec,rx=null,listEntries=[],tx=null;
const $=id=>document.getElementById(id);
let opq=Promise.resolve(), waiter=null, recOn=false, noteTmr=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function enqueue(fn){opq=opq.then(async()=>{while(tx)await sleep(300);return fn()}).catch(e=>log('hata: '+e));return opq}
function waitFor(kind,ms){return new Promise(res=>{const w={kind,res};waiter=w;setTimeout(()=>{if(waiter===w){waiter=null;res(null)}},ms)})}
const enc=new TextEncoder(), dec=new TextDecoder('utf-8',{fatal:false});
function clip(text,max){let b=enc.encode(text);if(b.length<=max)return b;b=b.slice(0,max);while(b.length&&(b[b.length-1]&0xC0)===0x80)b=b.slice(0,-1);if(b.length&&b[b.length-1]>=0xC0)b=b.slice(0,-1);return b}
async function sendNote(idx,text){
  const b=clip(text,120); let first=0,o=0;
  do{const part=b.slice(o,o+100), msg=new Uint8Array(3+part.length); msg[0]=5;msg[1]=idx;msg[2]=first;msg.set(part,3);
     const p=waitFor('a5',2500); await crec.writeValue(msg); const st=await p; if(st!==0)return false; first=1;o+=100}while(o<b.length);
  return true}
async function setFlag(idx,fl){const p=waitFor('a7',2500); await wr([7,idx,fl]); return (await p)===0}
async function getNote(idx){const p=waitFor('n85',2000); await wr([6,idx]); return p}
function showFlag(f){if(f.rb)f.rb.textContent=(f.flags&1)?'✓ indirildi':'';if(f.bx)f.bx.className=(f.flags&1)?'red':'gray'}
async function loadNotes(){
  let first=true;
  for(const f of listEntries.slice()){ if(!f)continue;
    const r=await getNote(f.idx);
    if(!r){ if(first){log('Kule not/işaret desteklemiyor veya yanıt yok (eski yazılım?)');return} continue}
    first=false; f.flags=r.flags;
    const dc=decFlags(r.flags);
    if(f.selK&&dc.kat&&document.activeElement!==f.selK)f.selK.value=dc.kat;
    if(f.selR&&dc.rek!==''&&document.activeElement!==f.selR)f.selR.value=dc.rek;
    if(dc.rek===''&&f.selR&&f.selR.value!==''){f.flags=encFlags(r.flags,f.selK.value,f.selR.value);const nf=f.flags;enqueue(()=>setFlag(f.idx,nf))}   // yerel/meta değerini Kule'ye taşı
    const sv=nGet()[nKey(f)]||{};
    if(f.selN){ if(r.text){ if(document.activeElement!==f.selN)f.selN.value=r.text }
                else if(sv.not){ f.selN.value=sv.not; const t=sv.not; enqueue(()=>sendNote(f.idx,t)) } }
    showFlag(f);
  }}
const log=m=>{$('log').textContent=new Date().toLocaleTimeString()+' '+m+'\n'+$('log').textContent};

function enable(on){['bStart','bStop','bList','bDelAll'].forEach(i=>$(i).disabled=!on)}

async function connect(){
  try{
    dev=await navigator.bluetooth.requestDevice({filters:[{services:[SVC]}],optionalServices:[SVC]});
    dev.addEventListener('gattserverdisconnected',()=>{$('sConn').textContent='koptu';enable(false)});
    const s=await dev.gatt.connect(); const svc=await s.getPrimaryService(SVC);
    cs=await svc.getCharacteristic(C_STATUS); cset=await svc.getCharacteristic(C_SET); crec=await svc.getCharacteristic(C_REC);
    cs.addEventListener('characteristicvaluechanged',onStatus); await cs.startNotifications();
    crec.addEventListener('characteristicvaluechanged',onRec); await crec.startNotifications();
    $('sConn').textContent='bağlı'; enable(true);
    await setTime(); log('saat gönderildi');
  }catch(e){log('bağlantı hatası: '+e);try{dev&&dev.gatt.connected&&dev.gatt.disconnect()}catch(_){}}
}

function onStatus(ev){
  const v=ev.target.value; // 20 bayt
  const fl=v.getUint8(5), err=v.getUint8(8), batt=v.getUint8(13);
  $('sYaka').textContent= err==6?'eşleşme bekliyor': err==1||batt==255?'bağlı değil':('bağlı, pil %'+batt);
  recOn=!!(fl&0x10); $('sRec').textContent=recOn?'KAYITTA':'kapalı';
  $('sKonum').textContent=['bekliyor','takipte','belirsiz','kayıp','bitti'][v.getUint8(3)]+' / adım '+v.getUint8(2);
}

async function setTime(){
  const e=Math.floor(Date.now()/1000), b=new Uint8Array([0x40,4,e&255,(e>>8)&255,(e>>16)&255,(e>>>24)&255]);
  await cset.writeValue(b);
}
const KAT={standart:'Standart',bayan:'Bayan',engelli:'Engelli',oturarak:'Oturarak namaz',aci_zorlanan:'Açılarda zorlanan'};
// Kule'deki bayrak baytı: bit0 indirildi · bit1-3 rekat kodu (0 seçilmedi, 1 belirsiz, 2→2rk, 3→3rk, 4→4rk) · bit4-6 kategori (0 seçilmedi, 1..5)
const KATS=Object.keys(KAT), REKS=['','0','2','3','4'];
function encFlags(fl,kat,rek){const r=Math.max(0,REKS.indexOf(rek)), k=KATS.indexOf(kat)+1; return (fl&1)|(r<<1)|(k<<4)}
function decFlags(fl){const r=REKS[(fl>>1)&7], k=KATS[((fl>>4)&7)-1]; return {rek:r===undefined?'':r, kat:k||''}}
function metas(){try{return JSON.parse(localStorage.getItem('meta')||'[]')}catch(e){return[]}}
function saveMeta(epoch,kat,rek,not){const m=metas();m.push({epoch,kat,rek,not:not||''});localStorage.setItem('meta',JSON.stringify(m.slice(-60)))}
function findMeta(epoch){let best=null,bd=1e9;metas().forEach(x=>{const d=Math.abs(x.epoch-epoch);if(d<bd){bd=d;best=x}});return bd<=180?best:null}
function nKey(f){return f.epoch?('e'+f.epoch):('i'+f.idx+'_'+f.size)}
function nGet(){try{return JSON.parse(localStorage.getItem('notlar')||'{}')}catch(e){return{}}}
function nPut(f,o){if(o.rek==='')delete o.rek;if(o.kat==='')delete o.kat;const a=nGet();const k=nKey(f);a[k]=Object.assign(a[k]||{},o);localStorage.setItem('notlar',JSON.stringify(a))}
function updLastNote(v){const m=metas();if(m.length){m[m.length-1].not=v;localStorage.setItem('meta',JSON.stringify(m))}}
const wr=b=>crec.writeValue(new Uint8Array(b));

async function startRec(){if(!$('selRek').value){alert('Önce rekat sayısını seç');return}saveMeta(Math.floor(Date.now()/1000),$('selKat').value,$('selRek').value,$('txtNot').value);await setTime();await cset.writeValue(new Uint8Array([0x41,1,1]));log('kayıt başlatma gönderildi');setTimeout(()=>{const t=$('txtNot').value;enqueue(async()=>{await setFlag(0xFE,encFlags(0,$('selKat').value,$('selRek').value));if(t)await sendNote(0xFE,t)})},1500)}
async function stopRec(){const t=$('txtNot').value;if(t)await enqueue(()=>sendNote(0xFE,t));await cset.writeValue(new Uint8Array([0x41,1,0]));log('kayıt bitirme gönderildi');$('txtNot').value='';$('selRek').value=''}

function onRec(ev){
  const v=ev.target.value, t=v.getUint8(0);
  if(t===0x81){
    const idx=v.getUint8(1);
    if(idx===0xFF){listEntries=[];renderFiles();return}
    const total=v.getUint8(2); listEntries[idx]={idx,size:v.getUint32(3,true),epoch:v.getUint32(7,true)};
    if(idx===total-1){renderFiles();enqueue(loadNotes)}
  }else if(t===0x82&&tx){
    const seq=v.getUint16(1,true);
    tx.last=Date.now();
    if(tx.waitResume)return;
    if(seq!==tx.seq){resume('sıra bozuk');return}
    tx.seq=seq+1; tx.chunks.push(new Uint8Array(v.buffer.slice(v.byteOffset+3,v.byteOffset+v.byteLength)));
    tx.got+=v.byteLength-3; $('prog')&&($('prog').textContent=Math.round(100*tx.got/tx.size)+'%');
  }else if(t===0x83&&tx){
    const total=v.getUint32(2,true);
    if(tx.got===total&&!tx.waitResume)finishDownload(total); else resume('eksik');
  }else if(t===0x85){
    const n=v.getUint8(3), txt=dec.decode(new Uint8Array(v.buffer.slice(v.byteOffset+4,v.byteOffset+4+n)));
    if(waiter&&waiter.kind==='n85'){const w=waiter;waiter=null;w.res({idx:v.getUint8(1),flags:v.getUint8(2),text:txt})}
  }else if(t===0x84){
    const c=v.getUint8(1), st=v.getUint8(2);
    if(waiter&&waiter.kind==='a'+c){const w=waiter;waiter=null;w.res(st)}
    else if(waiter&&waiter.kind==='n85'&&c===6){const w=waiter;waiter=null;w.res(null)}
    else log('yanıt: komut '+c+' durum '+st)}
}

async function list(){listEntries=[];await wr([1]);log('liste istendi')}
function renderFiles(){
  const d=$('files'); d.innerHTML='';
  if(!listEntries.length){d.textContent='Kayıt yok.';return}
  listEntries.forEach(f=>{
    const el=document.createElement('div'); el.className='file';
    const when=f.epoch?new Date(f.epoch*1000).toLocaleString():'(saat yok)';
    el.innerHTML='<span>#'+(f.idx+1)+' '+when+'<br><small>'+Math.round(f.size/100)/10+' KB, ~'+Math.round((f.size-16)/10/10/60*10)/10+' dk</small></span>';
    const sv=nGet()[nKey(f)]||{}, m0=findMeta(f.epoch)||{};
    const m={kat:sv.kat||m0.kat||$('selKat').value, rek:(sv.rek?sv.rek:(m0.rek!==undefined?m0.rek:$('selRek').value)), not:(sv.not!==undefined?sv.not:(m0.not||''))};
    const sk=document.createElement('select'); Object.keys(KAT).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=KAT[k];if(k===m.kat)o.selected=true;sk.append(o)});
    const sr=document.createElement('select'); ['','2','3','4','0'].forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k===''?'rekat seç…':k==='0'?'belirsiz':k+' rekat';if(k===String(m.rek))o.selected=true;sr.append(o)});
    const tn=document.createElement('textarea'); tn.rows=2; tn.placeholder='Not'; tn.value=(m.not||''); tn.style.flex='1 1 100%';
const st=document.createElement('small'); st.style.flex='1 1 100%'; st.style.color='#8c8'; st.textContent=(sv.not!==undefined||sv.kat||sv.rek!==undefined)?'✓ kayıtlı':'';
    const ok=()=>{st.textContent='✓ kaydedildi '+new Date().toLocaleTimeString()};
    tn.oninput=()=>{nPut(f,{not:tn.value,kat:sk.value,rek:sr.value});st.style.color='#cc8';st.textContent='yazılıyor…';clearTimeout(f.tmr);
      f.tmr=setTimeout(()=>enqueue(async()=>{const okk=await sendNote(f.idx,tn.value);st.style.color=okk?'#8c8':'#f96';st.textContent=okk?("✓ Kule'ye kaydedildi "+new Date().toLocaleTimeString()):"⚠ Kule'ye yazılamadı (yalnız bu cihazda saklandı)"}),700)};
    sk.onchange=()=>{nPut(f,{kat:sk.value,not:tn.value,rek:sr.value});f.flags=encFlags(f.flags||0,sk.value,sr.value);enqueue(()=>setFlag(f.idx,f.flags));ok()};
    sr.onchange=()=>{nPut(f,{rek:sr.value,kat:sk.value,not:tn.value});f.flags=encFlags(f.flags||0,sk.value,sr.value);enqueue(()=>setFlag(f.idx,f.flags));ok()};
    f.selK=sk;f.selR=sr;f.selN=tn; el.append(sk,sr,tn,st);
    const b=document.createElement('button'); b.textContent='İndir'; b.onclick=()=>download(f);
    const x=document.createElement('button'); x.textContent='Sil'; x.className='gray'; x.onclick=async()=>{if(!(f.flags&1)&&!confirm('Bu kayıt henüz indirilmedi. Yine de silinsin mi?'))return;await wr([3,f.idx]);setTimeout(list,400)};
    const rb=document.createElement('span'); rb.style.color='#8c8'; rb.style.alignSelf='center'; f.rb=rb; f.bx=x; showFlag(f);
    el.append(b,x,rb); d.append(el);
  });
}
async function download(f){if(f.selR&&!f.selR.value){alert('Bu kayıt için rekat sayısını seç');return}
  tx={f,size:f.size,got:0,seq:0,chunks:[],bad:false,last:Date.now(),tries:0,waitResume:false};
  const p=document.createElement('div'); p.id='prog'; p.textContent='0%'; $('files').prepend(p);
  await wr([2,f.idx]); log('indirme başladı #'+(f.idx+1));
}
async function resume(why){
  if(!tx)return;
  if(tx.tries>=6){log('HATA: indirme tamamlanamadı ('+tx.got+'/'+tx.size+')');tx=null;return}
  tx.tries++; tx.waitResume=true; log('yeniden isteniyor ('+why+') bayt '+tx.got);
  await wr([2,tx.f.idx,tx.got&255,(tx.got>>8)&255,(tx.got>>16)&255,(tx.got>>>24)&255]);
  setTimeout(()=>{if(tx){tx.waitResume=false;tx.seq=0;tx.last=Date.now()}},300);
}
setInterval(()=>{if(tx&&!tx.waitResume&&Date.now()-tx.last>2000)resume('zaman aşımı')},1000);
function finishDownload(total){
  const f=tx.f, all=new Uint8Array(tx.got); let o=0; tx.chunks.forEach(c=>{all.set(c,o);o+=c.length});
  if(tx.got!==total){log('HATA: boyut uyuşmuyor ('+tx.got+'/'+total+')');tx=null;return}
  const kat=f.selK?f.selK.value:'standart', rek=f.selR?f.selR.value:'0';
  const name='namaz_'+kat+'_'+rek+'rk_'+(f.epoch?new Date(f.epoch*1000).toISOString().replace(/[:.]/g,'-').slice(0,19):('k'+(f.idx+1)));
  const not=f.selN?f.selN.value.split(String.fromCharCode(10)).join(' / ').split('#').join(''):'';
  save(new Blob([toCsv(all,kat,rek,not)],{type:'text/csv'}),name+'.csv');
  log('indirildi: '+name+'.csv'); tx=null;
  enqueue(async()=>{const nf=encFlags(f.flags||0,kat,rek)|1;if(await setFlag(f.idx,nf)){f.flags=nf;showFlag(f)}});
}
function toCsv(b,kat,rek,not){
  const dv=new DataView(b.buffer), v3=(b[2]===51), v2=(b[2]===50||v3), RS=v3?13:v2?11:10, n=Math.floor((b.length-16)/RS), epoch=dv.getUint32(4,true);
  let s='# epoch_s='+epoch+'\n# kategori='+kat+'\n# rekat='+rek+'\n# not='+(not||'')+'\n# surum='+(v3?'NK3':v2?'NK2':'NK1')+'\nt_s,pitch,roll,sensor_valid,tap,otomod_izliyor,yaka_canli,moving,yol_adimi'+(v2?',hareket_x4':'')+(v3?',ivme_alt_x100,ivme_ust_x100':'')+'\n';
  for(let i=0;i<n;i++){const o=16+i*RS, t=dv.getUint32(o,true), p=dv.getInt16(o+4,true), r=dv.getInt16(o+6,true), fl=dv.getUint8(o+8), st=dv.getUint8(o+9);
    s+=(t/1000).toFixed(2)+','+(p/100).toFixed(2)+','+(r/100).toFixed(2)+','+(fl&1)+','+((fl>>1)&7)+','+((fl>>4)&1)+','+((fl>>5)&1)+','+((fl>>6)&1)+','+st+(v2?','+dv.getUint8(o+10):'')+(v3?','+dv.getUint8(o+11)+','+dv.getUint8(o+12):'')+'\n'}
  return s;
}

async function save(blob,name){
  const file=new File([blob],name);
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
}
$('txtNot').oninput=()=>{updLastNote($('txtNot').value);clearTimeout(noteTmr);noteTmr=setTimeout(()=>{if(recOn)enqueue(()=>sendNote(0xFE,$('txtNot').value))},800)};
$('bConn').onclick=connect; $('bStart').onclick=startRec; $('bStop').onclick=stopRec; $('bList').onclick=list;
$('bDelAll').onclick=async()=>{if(confirm('Tüm kayıtlar silinsin mi?')){await wr([4]);setTimeout(list,400)}};
</script>
</body>
</html>
